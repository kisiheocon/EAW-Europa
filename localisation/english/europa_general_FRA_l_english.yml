FRA_character_erwin_rommel_char: "Erwin Rommel"
FRA_character_erwin_rommel_char_desc: "§YName:§! §LJohannes Erwin Eugen Rommel§!\n§YPlace of Birth:§! §LHeidenheim, Kingdom of Württemberg, German Empire§!\n§YDate of Birth:§! §L15 November 1891§!"

FRA_the_desert_fox_trait: "The Desert Fox"

FRA_generalfeldmarschall_erwin_rommel_trait: "Generalfeldmarschall"
FRA_generalfeldmarschall_erwin_rommel_trait_desc: "§Y§!\n\n£GFX_texticon_europa_generalfeldmarschall \n\n\n\n§LFollowing the disastrous defeat of the vaunted Afrika Korps in May of 1943, Rommel's recall to Europe, first in Italy then later in France, was accompanied by a promotion to Generalfeldmarschall with the intent of overseeing the Atlantic Wall. This rank provided the necessary military and political leverage to manage the increasingly convoluted relationship with Vichy France, an administrative triumph that successfully averted Operation Case Anton.\n\nRecognizing his administrative victory with the French and his considerable tactical prowess throughout the war, the increasingly paranoid Führer personally dispatched Rommel to Saint-Étienne in early 1944. Armed with the highest security clearance, he was ordered to oversee the massive German contingent and safeguard the highly classified Element 665 atomic project from suspected Allied espionage, unknowingly damning both himself and his staff to an exile of the most egregious kind.§!"

FRA_armored_savant_trait: "Armored Savant"
FRA_armored_savant_trait_desc: "§LErwin Rommel is a convoluted man, seldom content in distant command tents. His world renowned mastery of both wheel and tread was brutally forged by adapting light infantry tactics learned in the First World War directly into the overwhelming momentum of mechanized warfare of the Second. From infiltrating Italian mountain lines at Caporetto in 1917 to unleashing the rapid, deceptive momentum of the 7th Panzer Division across France in 1940 during Fall Gelb, his entire operational doctrine has relied on commanding from the front in every possible meaning, bypassing bureaucracy to paralyze and pierce enemy strong points.\n\nIn this strange new world, this militant pragmatism has transformed into a desperate and increasingly personal crusade. Hauntingly reminiscent of Napoleon's abandonment of his men in Egypt in 1799, Rommel was secretly ordered out of Tunisia in May 1943, safely evacuated just before the catastrophic collapse of his beloved Afrika Korps. Carrying the unvoiced weight of survivor's guilt from what bitterly became known as Tunisgrad, the Field Marshal refuses to ever leave his troops behind again. This relentless obsession to lead from the battlefront gives his forces an unparalleled tactical edge, but the cost of his loss would be high. For his sake, one can only hope he never has to pay it.§!"

europa_modifier_block_conscription_tt: "§RCannot replace §YConscription Law§!§!\n"

europa_FRA_triumvirate_idea: "A Triumvirate of Necessity"
europa_FRA_triumvirate_idea_desc: "Governance and military direction has been hastily split between the Wehrmacht garrison, led by Field Marshal Rommel, The Vichy Administration and its garrison, led by Marshal Petain, and Oberführer Puaud's Waffen S.S Charlemagne division, regardless of its impacts such a union has been made necessary by our circumstances, lest a city wide civil war ensue."

europa_FRA_chain_of_command_0_idea: "Crippled Chain Of Command"
europa_FRA_chain_of_command_0_idea_desc: "We have found ourselves completely cut off from both Vichy and Berlin, leaving our forces in a volatile limbo. Field Marshal Rommel's staff and Marshal Pétain's administration are locked in a bitter deadlock over who holds supreme legislative veto power. Meanwhile, the more radical S.S Charlemagne division has largely detached itself from the chain of command, acting as a loosely controlled gendarmerie throughout the city of Saint-Entiene. Without standing orders, a unified command structure, or legal precedent, our military and civil apparatus of state is a powder keg waiting to detonate."

europa_FRA_supply_0_idea: "Evaporated Supply Lines"
europa_FRA_supply_0_idea_desc: "Following the §RSTRENG GEHEIM§! incident all supply lines outside of the city have been cut. And we are faced with critical shortages in all major resources and utility services. The only supplies that remain are those within the city limits.\n\nOur current supply situation is:\n§RCritical.\nStrained.\nManaged.§!"
europa_FRA_supply_0_idea_tt: "§RCannot replace §YTrade Law§! and §YEconomy Law§!§!\n"
