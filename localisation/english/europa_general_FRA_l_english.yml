FRA_provisional_high_command_char: "Saint-Entienne High Command"
FRA_provisional_high_command_char_desc: "Officially denoted as the \"Unified high command of the armed forces of Saint-Etienne\", the various divisions, battalions and militia units that were unfortunate enough to be within the city limits have been jury rigged into a convoluted and often dysfunctional system of both governance and military order. The officers and generals of these forces, who were so often saved from discomfort and disorder as a result of their ranks and stature, are no exception. While nominally under civilian governance before the §RSTRENG GEHEIM§! incident, civil authority in the city has been largely subsumed by the sheer number and proximity of military units. Ideology and national loyalty have been, for the moment at least forcibly sidelined by the increasingly bleak state of affairs. And law and order have been ensured, if only temporarily by the passive enforcement of infantry units, or by the barely controlled brutality of the Waffen S.S. It remains to be seen if this ad hoc government can prove itself, for the price of progress is steep, and if history has proven anything, it more often than not is insurmountable.\n\n§YArtist:§! Duke Horner"

